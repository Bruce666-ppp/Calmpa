<form id="contact-form" action="https://formspree.io/f/moevzgwj" method="post">
    <input type="hidden" name="subject" value="个人网站联系咨询">
    <fieldset>
      <label for="contact-name">Your name</label>
      <input id="contact-name" name="name" autocomplete="name" maxlength="120">
      <label for="contact-email">Your email <span aria-hidden="true">*</span></label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254">
      <label for="contact-message">Message <span aria-hidden="true">*</span></label>
      <textarea id="contact-message" name="message" required rows="3" maxlength="10000"></textarea>
      <button class="button" type="submit">Send message</button>
    </fieldset>
    <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </form>
